<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revolution Idle</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-start: #0f172a;
      --bg-end: #1e1b4b;
      --panel: rgba(15, 23, 42, 0.78);
      --panel-border: rgba(148, 163, 184, 0.28);
      --text-main: #e2e8f0;
      --text-subtle: #94a3b8;
      --btn-start: #60a5fa;
      --btn-end: #6366f1;
      --btn-hover-start: #3b82f6;
      --btn-hover-end: #4f46e5;
      --btn-shadow: rgba(59, 130, 246, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-main);
      background: radial-gradient(circle at top right, #312e81 0%, transparent 45%),
        linear-gradient(135deg, var(--bg-start), var(--bg-end));
    }

    #dilation_tree {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .node {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.35);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      will-change: transform, opacity;
    }

    .node:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.45);
    }

    .node-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      min-width: 0;
    }

    @media (max-width: 640px) {
      .node-text {
        font-size: 14px;
      }

      .node {
        padding: 12px;
        gap: 8px;
      }
    }

    .content {
      grid-column: 1 / -1;
      margin-top: 4px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      transition: all 0.3s ease;
      background: rgba(15, 23, 42, 0.55);
      padding: 12px;
      color: var(--text-subtle);
      font: 500 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .content.hidden {
      display: none;
    }

    .toggle-container {
      max-width: 1400px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.3);
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 200px;
    }

    .toggle-label {
      font-size: 15px;
      font-weight: 600;
      user-select: none;
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: rgba(148, 163, 184, 0.3);
      border-radius: 26px;
      transition: background 0.25s ease;
      cursor: pointer;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .toggle-switch input:checked+.toggle-slider {
      background: linear-gradient(135deg, var(--btn-start), var(--btn-end));
    }

    .toggle-switch input:checked+.toggle-slider::before {
      transform: translateX(22px);
    }
  </style>
  <script src="./src/main.js"></script>
</head>

<body>
  <div class="toggle-container">
    <div class="toggle-item">
      <label class="toggle-label" for="hide-content-toggle">隐藏内容</label>
      <label class="toggle-switch">
        <input type="checkbox" id="hide-content-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
  <div id="dilation_tree"></div>
</body>

</html>
